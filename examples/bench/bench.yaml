# Suite defaults for `docsgpt-cli bench`. Every setting here can be
# overridden per case (case.yaml) or from the command line.

# Agent to benchmark: a key NAME from `docsgpt-cli keys`, or a literal API key.
# Any value here (or in case.yaml) can reference environment variables as
# ${VAR} — resolved from your shell, this directory's .env, or ./.env, in that
# order ($$ escapes a literal dollar). That keeps committed YAML secret-free:
#   agent: ${DOCSGPT_BENCH_KEY}
agent: my-agent

# Wire protocol: v1 (OpenAI-compatible, reports token usage; add `stream: true`
# for SSE + time-to-first-token), stream (native SSE, records TTFT + frame
# types), answer (native /api/answer JSON), or webhook (async; requires
# webhook_url).
target: v1

# Model id sent with every request (stream/answer: model_id, v1: model). Unset
# = the agent's default. `--model X` overrides it; `--matrix m1,m2,m3` runs the
# suite once per model and prints a comparison table.
# model: gpt-5.6-terra

# Attachments: upload (default; /api/store_attachment) or inline (v1 only;
# base64 content parts in the message, the path OpenAI-compat clients take).
# attachments_mode: upload

# base_url: https://gptcloud.arc53.com

# Required for target: webhook — mint it in the DocsGPT UI or via
# GET /api/agent_webhook?id=<agent_id> on your own deployment. The URL contains
# the secret token: inject it via ${VAR} or the --webhook-url flag instead of
# committing it.
# webhook_url: ${DOCSGPT_WEBHOOK_URL}

# LLM-as-judge used by cases with an expect.judge section. model/temperature
# are forwarded in the judge chat request; verdicts (score + reasoning) are
# recorded verbatim in --json output.
# judge:
#   agent: judge-agent
#   model: gpt-5.6-sol
#   temperature: 0

# Tag every request with `X-DocsGPT-Bench-Tag: bench:<tag>` so server-side
# telemetry can attribute and exclude bench traffic (or pass --run-tag).
# run_tag: nightly

# Prices (USD per 1M tokens) for the cost column, keyed by model id — used when
# GET /api/models exposes no pricing. Cost needs token usage (v1 target).
# pricing:
#   gpt-5.6-terra: {input_per_million: 1.25, output_per_million: 10}

# How many cases run in parallel.
concurrency: 2

# Per-run timeout and webhook/attachment polling cadence.
timeout: 120s
poll_interval: 2s

# Run every case N times and require at least min_pass passes (LLMs flake).
# repeat: 3
# min_pass: 2
