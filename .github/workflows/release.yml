name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Only the canonical repository publishes. A tag pushed on a fork would
    # otherwise build a Cask whose download URLs point at the fork and commit
    # it over the real one in the shared tap.
    if: github.repository == 'arc53/DocsGPT-cli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workflow only triggers on v*, so this is always the CLI tag.
          # Without it GoReleaser derives the version from git describe, which
          # can pick up an sdk/vX.Y.Z tag on the same commit and stamp the
          # binary "vsdk/v0.1.0-...". Verified: it does exactly that.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Fine-grained token with contents:write on arc53/homebrew-DocsGPT-cli
          # only; GITHUB_TOKEN cannot reach another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
